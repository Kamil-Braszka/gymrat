<title>GymRat</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#131313;--mut:#6a6a66;--line:#d9d7cf;--bad:#a3261c}
@media (prefers-color-scheme: dark){:root{--bg:#0e0f11;--card:#181a1e;--ink:#f3f3f0;--mut:#9b9ea4;--line:#2b2e34;--bad:#ff8a7d}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
form[hidden]{display:none}
form{position:absolute;inset:0;margin:0 auto;max-width:420px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px max(20px,env(safe-area-inset-right)) 30vh max(20px,env(safe-area-inset-left))}
#f h1{font-size:30px;font-weight:800}
#f p{color:var(--mut);font-size:15px}
#f input,#f button{font:inherit;height:52px;border-radius:13px;border:1px solid var(--line);-webkit-appearance:none;appearance:none}
#f input{background:var(--card);color:var(--ink);padding:0 16px;font-size:18px;outline:0}
#f input:focus{border-color:var(--ink)}
#f button{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:17px;font-weight:650}
#f button[disabled]{opacity:.5}
#f #e{color:var(--bad);min-height:1.3em;font-weight:600}
</style>
</head>
<body>
<form id="f" hidden autocomplete="on" method="post" action="#" onsubmit="return false">
<h1>GymRat</h1>
<p>Podaj hasło. Na tym urządzeniu zostanie zapamiętane na 31 dni.</p>
<input type="text" name="username" value="GymRat" autocomplete="username" hidden>
<input id="p" type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Hasło" aria-label="Hasło">
<button id="b">Otwórz</button>
<p id="e" role="alert"></p>
</form>

<script>
(function(){
'use strict';
var SALT='GQA0QXWHo/Lx+rlHsLsD3A==',ITER=600000,DAYS=31,KS='gymrat.kafar.key.v1';
var f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),e=document.getElementById('e');
function bytes(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function b64(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function ask(msg){f.hidden=false;e.textContent=msg||'';b.disabled=false;b.textContent='Otwórz';}
if(!(window.crypto&&crypto.subtle)){ask('Ta przeglądarka nie obsługuje szyfrowania (otwórz adres https).');b.disabled=true;return;}
var data=bytes(document.getElementById('d').textContent.trim());
function open(raw){
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:data.subarray(0,12)},k,data.subarray(12));
  }).then(function(buf){
    var html=new TextDecoder().decode(buf);
    return new Promise(function(done){
      function swap(){setTimeout(function(){document.open();document.write(html);document.close();done();},0);}
      if(document.readyState==='complete')swap();else window.addEventListener('load',swap);
    });
  });
}
function derive(pass){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes(SALT),iterations:ITER,hash:'SHA-256'},k,256);
  }).then(function(bits){return new Uint8Array(bits);});
}
f.addEventListener('submit',function(ev){
  ev.preventDefault();
  var pass=p.value.trim();if(!pass)return;
  b.disabled=true;b.textContent='Otwieram…';e.textContent='';
  derive(pass).then(function(raw){
    return open(raw).then(function(){
      try{localStorage.setItem(KS,JSON.stringify({k:b64(raw),exp:Date.now()+DAYS*864e5}));}catch(x){}
    });
  }).catch(function(){ask('Błędne hasło.');p.select();});
});
var saved=null;
try{saved=JSON.parse(localStorage.getItem(KS));}catch(x){}
if(saved&&saved.k&&saved.exp>Date.now()){
  open(bytes(saved.k)).catch(function(){try{localStorage.removeItem(KS);}catch(x){}ask('Hasło zostało zmienione — podaj nowe.');});
}else{
  try{localStorage.removeItem(KS);}catch(x){}
  ask(saved?'Minęło '+DAYS+' dni — podaj hasło ponownie.':'');
}
})();
</script>
